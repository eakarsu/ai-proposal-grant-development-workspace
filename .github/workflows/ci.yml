name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inspection
          POSTGRES_PASSWORD: inspection-fixture-only
          POSTGRES_DB: inspection_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inspection -d inspection_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://inspection:inspection-fixture-only@127.0.0.1:5432/inspection_test_ci
      NEXTAUTH_SECRET: isolated-ci-fixture-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/integration-test.cjs
      - run: npm run build
      - run: npm audit --omit=dev
